<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本語 助詞クイズ (Particles Quiz)</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 30px;
            width: 90%;
            max-width: 520px;
            text-align: center;
        }
        .progress {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .sentence-box {
            background-color: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .sentence {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            line-height: 1.6;
        }
        .blank {
            background-color: #edf2f7;
            border-bottom: 3px solid #4a5568;
            padding: 2px 15px;
            margin: 0 5px;
            display: inline-block;
            min-width: 40px;
            color: #4a5568;
        }
        .question-text {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #4a5568;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .particle-btn {
            padding: 15px 40px;
            font-size: 1.4rem;
            font-weight: bold;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .particle-btn:hover {
            background-color: #edf2f7;
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
        
        /* 文法要素の色分け設定 */
        .subject-color { color: #ff4d4d; font-weight: bold; }
        .noun-color { color: #1e90ff; font-weight: bold; }
        .verb-color { color: #2ed573; font-weight: bold; }
        .particle-color { color: #a0aec0; font-weight: normal; } /* 助詞はあえて控えめな色に */

        .result-panel {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            display: none;
            text-align: left;
        }
        .correct {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
        }
        .incorrect {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        .result-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .english-translation {
            font-size: 1rem;
            font-style: italic;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        .breakdown {
            margin: 15px 0 0 0;
            font-size: 1.05rem;
            line-height: 2;
            background: rgba(255, 255, 255, 0.7);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .next-btn {
            width: 100%;
            padding: 14px;
            background-color: #2d3748;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        .next-btn:hover {
            background-color: #1a202c;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress" id="progress">Question 1 / 6</div>
    
    <div class="sentence-box">
        <div class="sentence" id="sentence-display">watashi [ ? ] niku o tabemasu.</div>
    </div>
    
    <div class="question-text">Choose the correct particle (助詞)!</div>
    
    <div class="btn-container">
        <button class="particle-btn" onclick="checkAnswer('wa')">wa</button>
        <button class="particle-btn" onclick="checkAnswer('o')">o</button>
    </div>

    <div class="result-panel" id="result-panel">
        <div class="result-title" id="result-title">Correct! 🎉</div>
        <div class="english-translation" id="english-translation">Meaning: I eat meat.</div>
        <strong>Grammar Structure:</strong>
        <div class="breakdown" id="breakdown">
            <!-- ここに色分けされた文法構造が入ります -->
        </div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question ➔</button>
    </div>
</div>

<script>
    // クイズデータ（1つの文章につき、waとoの2問ずつに分けて合計6問構成にしています）
    const quizData = [
        // 文章1
        {
            displaySentence: "watashi <span class='blank'>?</span> niku o tabemasu.",
            correctAnswer: "wa",
            english: "I eat meat.",
            breakdown: "・<span class='subject-color'>Subject (主語):</span> watashi<br>・<span class='noun-color'>Noun (名詞):</span> niku<br>・<span class='verb-color'>Verb (動詞):</span> tabemasu"
        },
        {
            displaySentence: "watashi wa niku <span class='blank'>?</span> tabemasu.",
            correctAnswer: "o",
            english: "I eat meat.",
            breakdown: "・<span class='subject-color'>Subject (主語):</span> watashi<br>・<span class='noun-color'>Noun (名詞):</span> niku<br>・<span class='verb-color'>Verb (動詞):</span> tabemasu"
        },
        // 文章2
        {
            displaySentence: "watashi no okaasan <span class='blank'>?</span> sakana o tabemashita.",
            correctAnswer: "wa",
            english: "My mother ate fish.",
            breakdown: "・<span class='subject-color'>Subject (主語):</span> watashi no okaasan<br>・<span class='noun-color'>Noun (名詞):</span> sakana<br>・<span class='verb-color'>Verb (動詞):</span> tabemashita <small>(Past)</small>"
        },
        {
            displaySentence: "watashi no okaasan wa sakana <span class='blank'>?</span> tabemashita.",
            correctAnswer: "o",
            english: "My mother ate fish.",
            breakdown: "・<span class='subject-color'>Subject (主語):</span> watashi no okaasan<br>・<span class='noun-color'>Noun (名詞):</span> sakana<br>・<span class='verb-color'>Verb (動詞):</span> tabemashita <small>(Past)</small>"
        },
        // 文章3
        {
            displaySentence: "watashi no tomodachi <span class='blank'>?</span> eiga o mimasu.",
            correctAnswer: "wa",
            english: "My friend watches a movie.",
            breakdown: "・<span class='subject-color'>Subject (主語):</span> watashi no tomodachi<br>・<span class='noun-color'>Noun (名詞):</span> eiga<br>・<span class='verb-color'>Verb (動詞):</span> mimasu"
        },
        {
            displaySentence: "watashi no tomodachi wa eiga <span class='blank'>?</span> mimasu.",
            correctAnswer: "o",
            english: "My friend watches a movie.",
            breakdown: "・<span class='subject-color'>Subject (主語):</span> watashi no tomodachi<br>・<span class='noun-color'>Noun (名詞):</span> eiga<br>・<span class='verb-color'>Verb (動詞):</span> mimasu"
        }
    ];

    let currentIdx = 0;

    function loadQuiz() {
        const data = quizData[currentIdx];
        
        // 画面表示のリセット
        document.getElementById("progress").innerText = `Question ${currentIdx + 1} / ${quizData.length}`;
        document.getElementById("sentence-display").innerHTML = data.displaySentence;
        document.getElementById("result-panel").style.display = "none";
        
        // ボタンの有効化
        const buttons = document.querySelectorAll(".particle-btn");
        buttons.forEach(btn => btn.disabled = false);
    }

    function checkAnswer(userAnswer) {
        const data = quizData[currentIdx];
        const resultPanel = document.getElementById("result-panel");
        const resultTitle = document.getElementById("result-title");
        
        // ボタンを連打できないように無効化
        const buttons = document.querySelectorAll(".particle-btn");
        buttons.forEach(btn => btn.disabled = true);

        // 正誤判定
        if (userAnswer === data.correctAnswer) {
            resultPanel.className = "result-panel correct";
            resultTitle.innerText = "Correct! 🎉";
        } else {
            resultPanel.className = "result-panel incorrect";
            resultTitle.innerText = "Incorrect... 💡 Keep trying!";
        }

        // クイズ内の [ ? ] を、ユーザーが選んだ文字に置き換えて見せる
        document.querySelector(".blank").innerText = userAnswer;
        document.querySelector(".blank").style.color = userAnswer === data.correctAnswer ? "#166534" : "#991b1b";

        // 解説のセット
        document.getElementById("english-translation").innerText = `Meaning: ${data.english}`;
        document.getElementById("breakdown").innerHTML = data.breakdown;
        resultPanel.style.display = "block";

        // 最後の問題判定
        if (currentIdx === quizData.length - 1) {
            document.getElementById("next-btn").innerText = "Restart Quiz ↺";
        } else {
            document.getElementById("next-btn").innerText = "Next Question ➔";
        }
    }

    function nextQuestion() {
        if (currentIdx === quizData.length - 1) {
            currentIdx = 0;
        } else {
            currentIdx++;
        }
        loadQuiz();
    }

    // アプリ起動
    loadQuiz();
</script>

</body>
</html>
